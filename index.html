<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ARQAM AI</title>

    <!-- Custom Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"> <!-- English font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet"> <!-- Arabic font -->

    <!-- CSS Styling -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #20493C; /* Background color */
            color: white;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #1c3d35 0%, #0e2921 100%); /* Adding depth with gradient */
        }

        h1 {
            font-size: 5em; /* Increased size for a bigger feel */
            font-weight: 700;
            letter-spacing: 0.05em; /* Slight spacing for professional look */
            margin-bottom: 0px;
        }

        h1 .arabic {
            font-family: 'Cairo', sans-serif;
            font-size: 5em;
            margin-left: 10px;
        }

        .container {
            max-width: 900px;
            padding: 20px;
            animation: fadeIn 1.5s ease-in-out; /* Animation */
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .subtitle {
            font-size: 1.8em; /* Bigger subtitle for importance */
            margin-bottom: 40px;
            margin-top: 0;
            color: #cfcfcf;
        }


        /* Clean, Full-width Email Form */
        .email-form {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            width: 100%; /* Full width */
        }

        .email-form input[type="email"] {
            padding: 15px;
            font-size: 1.2em;
            border: none;
            border-radius: 30px 0 0 30px;
            width: 60%; /* Flexible width */
            max-width: 500px;
            border-right: 1px solid #ddd; /* Subtle border between input and button */
        }

        .email-form input[type="submit"] {
            padding: 15px 30px;
            font-size: 1.2em;
            background-color: #409077; /* Light accent */
            color: white;
            border: none;
            border-radius: 0 30px 30px 0;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .email-form input[type="submit"]:hover {
            background-color: #387d67; /* Darker hover */
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>ARQAM AI</h1>
        <p class="subtitle">We are building the most powerful Arabic LLM</p>

        <!-- CTA Email Form Box -->
        <p>Get early access to our launch and updates. Sign up today!</p>
        <form class="email-form" action="https://formspree.io/f/xrbggwkb" method="POST">
            <input type="email" name="email" placeholder="Enter your email" required>
            <input type="submit" value="Reserve My Spot">
        </form>


    </div>
</body>
</html>
